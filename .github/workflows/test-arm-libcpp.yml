name: Test ARM Ubuntu 24.04 libc++

on:
  pull_request:

jobs:
  test-arm:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          # Used by lldb
          sudo apt-get install swig libedit-dev libc++-dev
          which clang++
          clang++ --version
